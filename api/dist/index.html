<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Font bootstrap.icons JSON</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css'>
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.css'>
  <link rel="stylesheet" href="./style.css">

</head>

<body data-bs-theme="dark">

  <div id="content" class="container my-5">
    <div class="d-flex mb-4">
      <h2 id="icons" class="mb-0">Icons</h2>
      <form class="subnav-search d-flex flex-nowrap ms-auto" onsubmit="return false;">
        <label for="search" class="visually-hidden">Search for icons</label>
        <input class="form-control search mb-0" id="search" type="search" placeholder="Start typing to filter..."
          autocomplete="off">
        <button id="search-button" class="btn btn-primary ms-2" type="button">Search</button>
      </form>
    </div>

    <ul id="bootstrap-icons" class="row row-cols-3 row-cols-sm-4 row-cols-lg-6 row-cols-xl-8 list-unstyled list"></ul>
  </div>

  <script>
    let icons = []; // Variável para armazenar os ícones

    fetch("https://cdn.jsdelivr.net/gh/davserv/d-framework@cdn/api/bootstrap.icons.json")
      .then((response) => response.json())
      .then((data) => {
        icons = data; // Armazena os ícones na variável
        displayIcons(icons); // Exibe todos os ícones inicialmente
      })
      .catch((error) => {
        console.log("ERROR", error);
      });

    function displayIcons(iconsToDisplay) {
      const icobootstrap = document.getElementById("bootstrap-icons");
      icobootstrap.innerHTML = ''; // Limpa a lista antes de adicionar novos ícones

      iconsToDisplay.forEach((icon) => {
        const listItem = document.createElement("div");
        listItem.innerHTML = `<li class="col mb-4" data-name="${icon.title}" data-tags="${icon.tags}" data-categories="${icon.categories}"> <a role="button" onclick="javascript:alert(title);" class="d-block text-body-emphasis text-decoration-none" title='&lt;i class="${icon.ligatura}"&gt;&lt;/i&gt;'> <div class="px-3 py-4 mb-2 bg-body-secondary text-center rounded"> <i class="${icon.ligatura}"></i>  </div> <div class="name text-muted text-decoration-none text-center pt-1">${icon.title}</div> </a> </li>`;
        icobootstrap.appendChild(listItem);
      });
    }

    document.getElementById("search-button").addEventListener("click", function () {
      const searchTerm = document.getElementById("search").value.toLowerCase();
      const filteredIcons = icons.filter(icon => icon.title.toLowerCase().includes(searchTerm));
      displayIcons(filteredIcons); // Exibe os ícones filtrados
    });
  </script>
